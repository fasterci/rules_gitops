apiVersion: batch/v1
kind: Job
metadata:
  name: hello
spec:
  template:
    spec:
      containers:
      - name: hello
        image: busybox
        command: ['sh', '-c', 'echo "Hello, Kubernetes!" && sleep 3600']
        env:
          - name: FULLNAME
            value: "{{//skylib/kustomize/tests:img_image}}"
          - name: FULLNAME_DIGEST
            value: "{{//skylib/kustomize/tests:img_image.digest}}"
          - name: FULLNAME_SHORTDIGEST
            value: "{{//skylib/kustomize/tests:img_image.short-digest}}"
          - name: ALIAS
            value: "{{testimgimage}}"
          - name: ALIAS_DIGEST
            value: "{{testimgimage.digest}}"
          - name: ALIAS_SHORTDIGEST
            value: "{{testimgimage.short-digest}}"
      restartPolicy: OnFailure
